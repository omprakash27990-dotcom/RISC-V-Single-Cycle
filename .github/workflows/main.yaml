name: RISC-V Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration:
    name: Integration Workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display project files
        run: |
          echo "RISC-V Single Cycle Integration"
          find . -name "*.sv" -o -name "*.v"

      - name: Check integration source
        run: |
    
          echo "Checking RISC-V source files..."

          for file in \
            Single_Cycle_RISCV/rtl.sv \
            IF_Stage/rtl.sv \
            ID_Stage/rtl.sv \
            EX_Stage/rtl.sv \
            WB_Stage/rtl.sv \
            ALU/rtl.sv \
            ALU_Control/rtl.sv
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done

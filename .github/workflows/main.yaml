name: RISC-V Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration:
    name: Integration Workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display project files
        run: |
          echo "RISC-V Single Cycle Integration"
          find . -name "*.sv" -o -name "*.v"

      - name: debug Check integration source
        run: |
          echo "Current directory:"
          pwd

          echo "Root files:"
          ls -la

          echo "Single Cycle folder:"
          ls -la Single_Cycle_RISCV/

          echo "Check RTL file:"
          if [ -f "./Single_Cycle_RISCV/rtl.sv" ]; then
            echo "RTL FILE FOUND"
          else
            echo "RTL FILE NOT FOUND"
            exit 1
          fi
